name: CI
on: [push, pull_request]

# Action majors are kept current, not pinned to whatever worked first. Every
# action here ran on Node 20, which GitHub deprecated: the runner forced them
# onto Node 24 and warned on every run. A warning today is a failure on the
# day the shim is removed, and that failure would land on an unrelated commit
# with nothing in the diff to explain it.

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: dev, POSTGRES_DB: techtrend}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TT_DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5432/techtrend
      TT_JWT_SECRET: ci-secret
      TT_AI_FAKE: "true"
      # Set, so `blobs._s3()` uses explicit MinIO credentials instead of the
      # default chain, and `ensure_bucket()` creates the bucket on first use.
      TT_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v7
      # Exact version, unlike the others. astral-sh stopped publishing floating
      # major tags after v7: `v10.2.0` is a tag and `v10` simply is not, so the
      # usual `@v10` fails to resolve and the job dies in "Set up job" before a
      # single step runs. Bumping this one means reading the tag list.
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run lint-imports          # layer violations fail the build
      - run: uv run alembic upgrade head
      # The read stage writes article bodies to object storage, so three of
      # its tests need a bucket. Without one they fail on NoCredentialsError:
      # with no endpoint set, boto3 falls back to its default credential
      # chain, and a runner has no credentials to find.
      #
      # `moto`, a pip-installed S3 stub, rather than a MinIO container. Three
      # registries were tried and all three broke the build: bitnami/minio's
      # `latest` tag does not exist, Docker Hub's minio/minio answers "pull
      # access denied", and quay.io's answers "unauthorized". A CI step that
      # depends on a third-party registry staying reachable is a CI step that
      # fails for reasons unrelated to the code -- and these tests only need
      # put, get and create_bucket, which a stub serves exactly as well.
      - name: Start S3 stub
        run: |
          uv pip install "moto[server]"
          uv run moto_server -p 9000 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:9000/ && echo "S3 stub ready" && exit 0
            sleep 1
          done
          echo "moto_server did not come up" >&2
          exit 1
      - run: uv run pytest tests -q

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: {version: 9}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build
