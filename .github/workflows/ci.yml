name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: dev, POSTGRES_DB: techtrend}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
    env:
      TT_DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5432/techtrend
      TT_JWT_SECRET: ci-secret
      TT_AI_FAKE: "true"
      # Set, so `blobs._s3()` uses explicit MinIO credentials instead of the
      # default chain, and `ensure_bucket()` creates the bucket on first use.
      TT_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run lint-imports          # layer violations fail the build
      - run: uv run alembic upgrade head
      # The read stage writes article bodies to object storage, so three of
      # its tests need a bucket. Without one they fail on NoCredentialsError:
      # with no endpoint configured, boto3 falls back to its default
      # credential chain, and a runner has no credentials to find.
      #
      # `docker run`, not a service container: the image needs the command
      # `server /data`, and a service container cannot set one.
      #
      # quay.io, not Docker Hub. `minio/minio` there now answers "pull access
      # denied", and `bitnami/minio:latest` no longer exists at all -- both
      # tried, both failed the build. quay.io is MinIO's own registry, and
      # this exact image and health check were pulled and run before pushing.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=dev -e MINIO_ROOT_PASSWORD=devdevdev \
            quay.io/minio/minio server /data
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not come up" >&2
          docker logs minio >&2
          exit 1
      - run: uv run pytest tests -q

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build
