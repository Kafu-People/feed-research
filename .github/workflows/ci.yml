name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: dev, POSTGRES_DB: techtrend}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 3s --health-retries 30
      # The read stage writes article bodies to object storage, so three of
      # its tests need a bucket. Without this they failed on
      # NoCredentialsError: with no endpoint configured, boto3 falls back to
      # the default credential chain, and a CI runner has no credentials.
      #
      # bitnami/minio rather than minio/minio: a GitHub service container
      # cannot override CMD, and the official image needs `server /data`.
      blobs:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: dev
          MINIO_ROOT_PASSWORD: devdevdev
        ports: ["9000:9000"]
    env:
      TT_DATABASE_URL: postgresql+asyncpg://postgres:dev@localhost:5432/techtrend
      TT_JWT_SECRET: ci-secret
      TT_AI_FAKE: "true"
      # Set, so `blobs._s3()` uses explicit MinIO credentials instead of the
      # default chain, and `ensure_bucket()` creates the bucket on first use.
      TT_S3_ENDPOINT: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run lint-imports          # layer violations fail the build
      - run: uv run alembic upgrade head
      # Waited for from the RUNNER, not by a service health-cmd: the health
      # check runs inside the image, and whether that image ships curl is not
      # something this workflow should depend on.
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not come up" >&2
          exit 1
      - run: uv run pytest tests -q

  clients:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 9}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter web build
