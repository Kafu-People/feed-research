# Infrastructure only. The backend and web run from the Makefile in local dev
# (`make api`, `make web`) so reloads are instant; production runs the same
# image with a different command -- see docs/development/15-deployment.md.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: techtrend
    # Bound to loopback, NOT 0.0.0.0. pg_hba rejects remote `postgres` logins,
    # and that reject was the ONLY thing between the open internet and a
    # superuser whose password is "dev" -- so the reject cannot be relaxed for
    # the host (docker-proxy makes host and internet traffic both arrive from
    # the bridge gateway, 172.19.0.1: pg_hba cannot tell them apart) until the
    # port stops being public. Reach it from elsewhere over an SSH tunnel:
    #   ssh -L 5432:127.0.0.1:5432 <host>
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: >
      postgres -c max_connections=200
               -c log_min_duration_statement=500ms

  cache:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  blobs:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dev
      MINIO_ROOT_PASSWORD: devdevdev
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  miniodata:
