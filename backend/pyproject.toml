[project]
name = "techtrend"
version = "0.1.0"
description = "A news app that ranks by what's new, not what's loud."
requires-python = ">=3.12"

dependencies = [
    # api
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # config / validation
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # db
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",  # sync driver: Alembic only
    "alembic>=1.14",
    "pgvector>=0.3.6",
    # infra
    "redis>=5.2",
    "boto3>=1.35",
    "httpx>=0.28",
    # ai
    "anthropic>=0.40",
    # cli / telemetry
    "typer>=0.15",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "respx>=0.22",
]

[project.scripts]
techtrend = "techtrend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/techtrend"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["techtrend"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: needs Postgres/Redis (deselect with '-m \"not integration\"')",
]
